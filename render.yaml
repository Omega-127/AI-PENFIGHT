# Render Blueprint specification for AI Penfight
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: ai-penfight-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: .
      - key: APP_NAME
        value: AI Penfight Backend
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: info
      - key: ALLOWED_ORIGINS
        value: https://ai-penfight.vercel.app,http://localhost:3000
      - key: LLM_PROVIDER
        value: fallback
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: LLM_API_KEY
        sync: false
      - key: LLM_TIMEOUT
        value: "30.0"
      - key: LLM_MAX_TOKENS
        value: "2048"
      - key: LLM_RETRIES
        value: "2"
      - key: MAX_INPUT_LENGTH
        value: "5000"
      - key: MIN_INPUT_LENGTH
        value: "2"
